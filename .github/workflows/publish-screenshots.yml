name: Publish screenshots
on:
  push:
    branches: [main]
    paths:
      - 'docs/screenshots/*.b64'
      - '.github/workflows/publish-screenshots.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode staged media files
        run: |
          set -euo pipefail
          shopt -s nullglob
          for f in docs/screenshots/*.b64; do
            out="${f%.b64}"
            base64 -d "$f" > "$out"
            rm -f "$f"
          done
      - name: Commit published media
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots/
          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Publish simulator screenshots and demo video"
          git push
