# Quick training — usable interactive model in ~3-6 hours on RTX 4090
# Full quality: use configs/vastai_training.yaml instead

use_wandb: false
wandb_project: surgical-worlds

dataset: LAPAROSCOPIC
preload_ratio: 0.3

patch_size: 4
context_length: 4
frame_size: 128
latent_dim: 6
num_bins: 4
n_actions: 8

amp: true
tf32: true
compile: false

distributed:
  use_ddp: false
  use_fsdp: false
  reshard_after_forward: false
nproc_per_node: 1
standalone: true

video_tokenizer_config: configs/quick_surgical_video_tokenizer.yaml
latent_actions_config: configs/quick_surgical_latent_actions.yaml
dynamics_config: configs/quick_surgical_dynamics.yaml

run_video_tokenizer: true
run_latent_actions: true
run_dynamics: true

optimizer: "adamw"
use_moe: false
fps: 10
